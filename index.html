<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мониторинг ПБ — демо</title>
<style>
:root {
  --bg: #f4f2ee;
  --panel: #ffffff;
  --ink: #1d1f22;
  --muted: #6b6f76;
  --line: #e2ded6;
  --accent: #b3261e;
  --accent-ink: #ffffff;
  --red: #c62828;   --red-bg: #fdecea;
  --yellow: #a76a00; --yellow-bg: #fff4d6;
  --green: #2e7d32; --green-bg: #e7f4e8;
  --gray: #6b6f76;  --gray-bg: #eeece8;
  --radius: 10px;
  font-size: 15px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; line-height: 1.45; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.6rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; margin: 1.4rem 0 .6rem; }
h3 { font-size: 1rem; margin: 1rem 0 .4rem; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }

/* --- верхняя панель --- */
.top { background: #1d1f22; color: #fff; }
.top .wrap { display: flex; align-items: center; gap: 1.2rem; min-height: 56px; flex-wrap: wrap; }
.brand { font-weight: 700; color: #fff; display: flex; gap: .5rem; align-items: center; font-size: 1.05rem; }
.brand:hover { text-decoration: none; }
.brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(179,38,30,.3); }
.nav { display: flex; gap: .2rem; flex-wrap: wrap; flex: 1; }
.nav a { color: #cfd2d6; padding: .4rem .7rem; border-radius: 6px; }
.nav a:hover, .nav a.on { background: #2f3236; color: #fff; text-decoration: none; }
.who { color: #aeb2b8; font-size: .85rem; display: flex; gap: .6rem; align-items: center; }
.who form { margin: 0; }
.who button { background: none; border: 1px solid #44484d; color: #cfd2d6; padding: .25rem .6rem; border-radius: 6px; cursor: pointer; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 1.2rem; }
main.wrap { padding-top: 1.4rem; padding-bottom: 3rem; }
.normbar { background: #2a2c30; color: #b9bdc2; font-size: .78rem; }
.normbar .wrap { padding-top: .35rem; padding-bottom: .35rem; }

/* --- карточки --- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
.grid { display: grid; gap: 1rem; }
.grid.k { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.grid.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .grid.two { grid-template-columns: 1fr; } }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; }
.kpi .v { font-size: 1.8rem; font-weight: 700; line-height: 1.1; }
.kpi .l { color: var(--muted); font-size: .82rem; }
.kpi.red .v { color: var(--red); } .kpi.yellow .v { color: var(--yellow); } .kpi.green .v { color: var(--green); }

.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

/* --- таблицы --- */
.tbl { width: 100%; border-collapse: collapse; background: var(--panel); }
.tbl th { text-align: left; font-weight: 600; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
  border-bottom: 1px solid var(--line); padding: .6rem .6rem; }
.tbl td { border-bottom: 1px solid var(--line); padding: .6rem .6rem; vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.row-red td:first-child { box-shadow: inset 3px 0 0 var(--red); }
.tbl tr.row-yellow td:first-child { box-shadow: inset 3px 0 0 #e0a100; }
.tbl tr.row-green td:first-child { box-shadow: inset 3px 0 0 var(--green); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin-bottom: 1rem; }

/* --- метки --- */
.pill { display: inline-block; padding: .12rem .55rem; border-radius: 99px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.yellow { background: var(--yellow-bg); color: var(--yellow); }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.gray { background: var(--gray-bg); color: var(--gray); }
.tag { display: inline-block; font-size: .75rem; padding: .05rem .45rem; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); }
.bar { height: 6px; background: var(--gray-bg); border-radius: 99px; overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--green); }

/* --- вкладки объекта --- */
.tabs { display: flex; gap: .2rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; overflow-x: auto; }
.tabs a { padding: .55rem .9rem; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs a:hover { text-decoration: none; color: var(--ink); }
.tabs .cnt { font-size: .72rem; background: var(--red-bg); color: var(--red); border-radius: 99px; padding: 0 .4rem; margin-left: .2rem; }

/* --- формы --- */
label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .25rem; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], select, textarea {
  width: 100%; padding: .5rem .6rem; border: 1px solid #cfcac0; border-radius: 7px; font: inherit; background: #fff; color: var(--ink); }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(179,38,30,.25); border-color: var(--accent); }
.field { margin-bottom: .8rem; }
.field .hint { font-size: .76rem; color: var(--muted); margin-top: .2rem; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 1rem; }
.check { display: flex; gap: .5rem; align-items: flex-start; color: var(--ink); font-size: .92rem; margin-bottom: .7rem; cursor: pointer; }
.check input { margin-top: .2rem; width: 17px; height: 17px; accent-color: var(--accent); }
.btn { display: inline-block; background: var(--accent); color: var(--accent-ink); border: 0; padding: .55rem 1rem; border-radius: 7px;
  font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.08); text-decoration: none; }
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid #cfcac0; }
.btn.sm { padding: .3rem .65rem; font-size: .85rem; }
.inline { display: inline; }
.rowform { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.rowform input, .rowform select { width: auto; }

.sys { border: 1px solid var(--line); border-radius: 8px; padding: .7rem .9rem; margin-bottom: .6rem; background: #fcfbf9; }
.sys .check { margin: 0; font-weight: 600; }
.sys .sysfields { margin-top: .7rem; display: none; }
.sys.on { border-color: #e8b4ae; background: #fff; }
.sys.on .sysfields { display: grid; }

/* --- чек-лист --- */
.cl-item { display: grid; grid-template-columns: 2.4rem 1fr 15rem; gap: .8rem; padding: .8rem .2rem; border-bottom: 1px solid var(--line); }
.cl-item:last-child { border-bottom: 0; }
.cl-no { font-weight: 700; color: var(--muted); }
.cl-ans { display: flex; gap: .3rem; }
.cl-ans label { margin: 0; flex: 1; text-align: center; border: 1px solid #cfcac0; border-radius: 6px; padding: .3rem 0; cursor: pointer; color: var(--ink); font-size: .85rem; }
.cl-ans input { display: none; }
.cl-ans input:checked + span { font-weight: 700; }
.cl-ans label:has(input[value=yes]:checked) { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.cl-ans label:has(input[value=no]:checked) { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.cl-ans label:has(input[value=na]:checked) { background: var(--gray-bg); border-color: var(--gray); }
.cl-extra { grid-column: 2 / 4; display: grid; grid-template-columns: 1fr 15rem; gap: .8rem; }
@media (max-width: 760px) {
  .cl-item { grid-template-columns: 2rem 1fr; }
  .cl-ans { grid-column: 2; }
  .cl-extra { grid-column: 2; grid-template-columns: 1fr; }
}

/* --- сообщения --- */
.flash { padding: .7rem 1rem; border-radius: 8px; margin-bottom: .8rem; }
.flash.ok { background: var(--green-bg); color: #1d5a21; }
.flash.error { background: var(--red-bg); color: var(--red); }
.warn { background: var(--yellow-bg); border: 1px solid #f0d58a; color: #6e4800; padding: .6rem .9rem; border-radius: 8px; margin-bottom: .5rem; font-size: .92rem; }

.login { max-width: 400px; margin: 8vh auto; }
.kv { display: grid; grid-template-columns: minmax(140px, 40%) 1fr; gap: .3rem .8rem; font-size: .93rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
details summary { cursor: pointer; color: var(--accent); font-size: .88rem; }
.empty { color: var(--muted); padding: 1.2rem; text-align: center; }

@media print {
  .top, .normbar, .tabs, .actions, .noprint { display: none !important; }
  body { background: #fff; }
  .panel, .tablewrap { border: 0; padding: 0; }
}
.tbl td:first-child { min-width: 180px; }
.demo { font-size: .66rem; background: var(--accent); color: #fff; padding: .1rem .4rem; border-radius: 4px; letter-spacing: .05em; }
.rolesel { background: #2f3236; color: #fff; border: 1px solid #44484d; max-width: 320px; padding: .35rem .5rem; font-size: .85rem; }
.savebar { position: sticky; bottom: 0; background: #fff; padding: .8rem 0 .2rem; border-top: 1px solid var(--line); }
.report { max-width: 900px; margin: 0 auto; background: #fff; padding: 1.5rem; border-radius: var(--radius); }
.report .tbl td, .report .tbl th { padding: .35rem .4rem; font-size: .85rem; }
.report h2 { border-bottom: 2px solid var(--ink); padding-bottom: .2rem; }
.sign { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2.5rem; font-size: .9rem; }
.sign div { border-top: 1px solid var(--ink); padding-top: .3rem; }
@media (max-width: 600px) { .who { width: 100%; padding-bottom: .5rem; } .rolesel { max-width: 100%; width: 100%; } }
@media (max-width: 760px) {
  .top .wrap { gap: .4rem; padding-top: .5rem; }
  .nav { order: 3; width: 100%; flex: none; flex-wrap: nowrap; overflow-x: auto; }
  .nav a { white-space: nowrap; }
  .who { order: 2; }
}

</style></head>
<body><div id="app"></div>
<script>
// ===== Нормативная база (копия norms.py полной версии) =====
const NORMS_NOTE = "Нормативная база: ППР в РФ (ПП РФ № 1479, действуют по 31.12.2026), 123-ФЗ, приказ МЧС № 1120, ГОСТ Р 59637-2021, ГОСТ Р 59641-2021. С 2027 г. правила утверждает МЧС России — номера пунктов изменятся.";

const FCLASSES = [
  ["Ф1.1","Детские сады, больницы, дома престарелых, спальные корпуса интернатов"],
  ["Ф1.2","Гостиницы, общежития, спальные корпуса санаториев и домов отдыха"],
  ["Ф1.3","Многоквартирные жилые дома"],["Ф1.4","Одноквартирные жилые дома"],
  ["Ф2.1","Театры, кинотеатры, концертные залы, клубы, цирки (в помещениях)"],
  ["Ф2.2","Музеи, выставки, танцевальные залы (в помещениях)"],
  ["Ф2.3","Зрелищные учреждения на открытом воздухе"],["Ф2.4","Музеи, выставки и т.п. на открытом воздухе"],
  ["Ф3.1","Торговля"],["Ф3.2","Общественное питание"],["Ф3.3","Вокзалы"],["Ф3.4","Поликлиники и амбулатории"],
  ["Ф3.5","Бытовое и коммунальное обслуживание"],["Ф3.6","Физкультурно-оздоровительные комплексы, спортзалы без трибун"],
  ["Ф4.1","Школы, внешкольные учреждения, СПО"],["Ф4.2","Вузы, организации ДПО"],
  ["Ф4.3","Органы управления, офисы, банки, НИИ, редакции"],["Ф4.4","Пожарные депо"],
  ["Ф5.1","Производственные здания, лаборатории, мастерские"],["Ф5.2","Складские здания, стоянки, архивы, книгохранилища"],
  ["Ф5.3","Сельскохозяйственные здания"],
];
const DUP_SIGNAL = ["Ф1.1","Ф1.2","Ф4.1","Ф4.2"];

const QUESTIONNAIRE = [
  {title:"Общие сведения", fields:[
    {key:"purpose",label:"Назначение объекта",type:"text",hint:"Например: офисный центр, склад, ТЦ"},
    {key:"usage_right",label:"Кто эксплуатирует",type:"select",options:["Собственник","Арендатор","Управляющая организация","Иное"]},
    {key:"responsible_name",label:"Ответственный за пожарную безопасность (ФИО)",type:"text"},
    {key:"responsible_position",label:"Должность ответственного",type:"text"},
    {key:"responsible_phone",label:"Телефон ответственного",type:"text"},
  ]},
  {title:"Характеристики здания", fields:[
    {key:"fclass",label:"Класс функциональной пожарной опасности",type:"select",options:FCLASSES.map(([c,d])=>`${c} — ${d}`)},
    {key:"floors",label:"Этажность (надземных этажей)",type:"number"},
    {key:"underground",label:"Подземных этажей",type:"number"},
    {key:"height_m",label:"Пожарно-техническая высота, м",type:"number"},
    {key:"area_m2",label:"Общая площадь, м²",type:"number"},
    {key:"fire_resistance",label:"Степень огнестойкости",type:"select",options:["I","II","III","IV","V","Не установлена"]},
    {key:"constr_class",label:"Класс конструктивной пожарной опасности",type:"select",options:["С0","С1","С2","С3","Не установлен"]},
    {key:"year_built",label:"Год ввода в эксплуатацию",type:"number"},
  ]},
  {title:"Люди на объекте", fields:[
    {key:"max_people",label:"Максимум людей одновременно",type:"number",hint:"50 и более — объект с массовым пребыванием людей (п. 5 ППР)"},
    {key:"workplaces10",label:"Есть этаж с 10 и более постоянными рабочими местами",type:"bool"},
    {key:"night_stay",label:"Ночное пребывание людей / круглосуточное дежурство персонала",type:"bool"},
    {key:"mgn",label:"Пребывают маломобильные группы населения",type:"bool"},
  ]},
  {title:"Пожарная опасность и документы", fields:[
    {key:"has_prod_storage",label:"Есть производственные или складские помещения",type:"bool"},
    {key:"categories",label:"Категории помещений по взрывопожарной и пожарной опасности",type:"text",hint:"Например: В3, В4, Д"},
    {key:"categories_ab",label:"Есть помещения категорий А или Б",type:"bool"},
    {key:"declaration",label:"Требуется декларация пожарной безопасности (ст. 64 123-ФЗ)",type:"select",options:["Не знаю","Да","Нет"]},
    {key:"risk_calc",label:"Выполнен расчёт пожарного риска",type:"bool"},
    {key:"stu",label:"Есть специальные технические условия (СТУ)",type:"bool"},
    {key:"facade_banners",label:"На фасаде есть баннеры, транспаранты, конструкции",type:"bool"},
    {key:"smoking_place",label:"Есть отведённое место для курения",type:"bool"},
    {key:"notes",label:"Примечания",type:"textarea"},
  ]},
];

const LIFE = [{key:"year",label:"Год ввода",type:"number"},{key:"life",label:"Срок службы, лет",type:"number",hint:"по паспорту, обычно 10"}];
const SYSTEMS = {
  aps:{name:"Автоматическая пожарная сигнализация (АПС)",spz:true,fields:[
    {key:"kind",label:"Тип",type:"select",options:["Адресная","Адресно-аналоговая","Пороговая"]},
    {key:"brand",label:"Оборудование (марка ППКП)",type:"text"},{key:"detectors",label:"Кол-во извещателей",type:"number"},...LIFE]},
  soue:{name:"Система оповещения и управления эвакуацией (СОУЭ)",spz:true,fields:[
    {key:"type",label:"Тип СОУЭ",type:"select",options:["1","2","3","4","5"]},{key:"brand",label:"Оборудование",type:"text"},...LIFE]},
  aupt:{name:"Автоматическая установка пожаротушения (АУПТ)",spz:true,fields:[
    {key:"kind",label:"Вид",type:"select",options:["Водяное спринклерное","Водяное дренчерное","Тонкораспылённая вода","Газовое","Порошковое","Аэрозольное","Пенное"]},
    {key:"rooms",label:"Защищаемые помещения",type:"text"},...LIFE]},
  smoke:{name:"Противодымная вентиляция (дымоудаление, подпор)",spz:true,fields:[{key:"kind",label:"Состав",type:"text",hint:"дымоудаление, подпор, клапаны"},...LIFE]},
  monitoring:{name:"Вывод сигнала на пульт пожарной охраны (ПАК)",spz:true,fields:[{key:"brand",label:"Оборудование / оператор",type:"text",hint:"например, ПАК «Стрелец-Мониторинг»"},...LIFE]},
  vpv:{name:"Внутренний противопожарный водопровод (ВПВ)",spz:true,fields:[{key:"cranes",label:"Кол-во пожарных кранов",type:"number"}]},
  pumps:{name:"Пожарная насосная станция / задвижки с электроприводом",spz:true,fields:[{key:"units",label:"Кол-во насосных агрегатов",type:"number"}]},
  outer_water:{name:"Наружное противопожарное водоснабжение",spz:false,fields:[
    {key:"kind",label:"Источники",type:"select",options:["Пожарные гидранты","Пожарный водоём / резервуар","Гидранты и водоём"]},
    {key:"count",label:"Количество",type:"number"},{key:"distance",label:"Расстояние до объекта, м",type:"number"}]},
  extinguishers:{name:"Огнетушители",spz:false,fields:[{key:"count",label:"Количество",type:"number"},{key:"types",label:"Типы",type:"text",hint:"ОП-4, ОУ-3 ..."}]},
  fire_doors:{name:"Противопожарные двери, ворота, люки, окна",spz:false,fields:[{key:"count",label:"Количество",type:"number"}]},
  emergency_light:{name:"Аварийное (эвакуационное) освещение",spz:false,fields:[{key:"count",label:"Кол-во светильников",type:"number"}]},
  fireproof:{name:"Огнезащитная обработка конструкций",spz:false,fields:[
    {key:"what",label:"Что обработано",type:"text",hint:"металлоконструкции, деревянная кровля..."},{key:"agent",label:"Огнезащитный состав",type:"text"},
    {key:"year",label:"Год обработки",type:"number"},{key:"life",label:"Срок службы покрытия, лет",type:"number"}]},
  ladders:{name:"Наружные пожарные лестницы и ограждения кровли",spz:false,fields:[{key:"count",label:"Кол-во лестниц",type:"number"}]},
  ventilation:{name:"Общеобменная вентиляция",spz:false,fields:[{key:"ozk",label:"Есть огнезадерживающие клапаны",type:"bool"}]},
  stove:{name:"Печное отопление / кухонные плиты на твёрдом топливе",spz:false,fields:[{key:"continuous",label:"Непрерывная топка",type:"bool"}]},
};

const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fcode = p => (p.fclass || "").split(" ")[0];
const isMass = p => num(p.max_people) >= 50 || !!p.workplaces10;
const has = (s, c) => c in s;
const anySpz = s => Object.keys(s).some(c => SYSTEMS[c] && SYSTEMS[c].spz);
function overLife(s, y) {
  const out = [];
  for (const [c, prm] of Object.entries(s)) {
    if (!SYSTEMS[c] || !SYSTEMS[c].spz) continue;
    const yr = num(prm.year), life = num(prm.life) || 10;
    if (yr && yr + life <= y) out.push(SYSTEMS[c].name);
  }
  return out;
}

const TASKS = [

function normWarnings(p, s, y) {

  if (!has(s,"extinguishers")) out.push("В анкете не указаны огнетушители — объект должен быть оснащён первичными средствами пожаротушения (ППР п. 60, разд. XIX).");
  if (isMass(p) && !has(s,"soue")) out.push("Объект с массовым пребыванием людей, но СОУЭ не указана — проверьте по СП 3.13130.");
  if (isMass(p) && !has(s,"aps") && !has(s,"aupt")) out.push("Нет АПС/АУПТ при массовом пребывании людей — проверьте требования СП 486.1311500.");
  const old = overLife(s, y);
  if (old.length) out.push("Срок службы истёк: " + old.join("; ") + ". Нужны ежегодные испытания или замена (ППР п. 54).");
  const fp = s.fireproof;
  if (fp && num(fp.year) && num(fp.life) && num(fp.year) + num(fp.life) <= y) out.push("Истёк срок службы огнезащитного покрытия — требуется повторная обработка или испытания (ППР п. 13).");
  return out;
}

// ---------- утилиты ----------
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const TODAY = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parse = s => { if (!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const ruDate = s => { const d = parse(String(s||"").slice(0,10)); return d ? d.toLocaleDateString("ru-RU") : "—"; };
function addMonths(d, m) {
  const t = new Date(d.getFullYear(), d.getMonth() + m, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d.getDate(), last)); return t;
}
const days = (a, b) => Math.round((a - b) / 86400000);
function periodLabel(m) {
  if (m === 1) return "ежемесячно"; if (m === 3) return "раз в квартал"; if (m === 6) return "раз в полгода";
  if (m % 12 === 0) { const y = m / 12; return y === 1 ? "раз в год" : y >= 5 ? `раз в ${y} лет` : `раз в ${y} года`; }
  return `раз в ${m} мес.`;
}
const pill = (cls, text) => `<span class="pill ${cls}">${h(text)}</span>`;

let DB, ROLE;
function load() {
  try { DB = JSON.parse(localStorage.getItem(KEY)); } catch (e) { DB = null; }
  if (!DB || !DB.objects) { DB = seed(); save(); }
  try { ROLE = JSON.parse(localStorage.getItem(ROLE_KEY)); } catch (e) { ROLE = null; }
  if (!ROLE) ROLE = {mode:"provider"};
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { alert("Не удалось сохранить: закончилось место в браузере."); } }
const nid = () => ++DB.seq;

const userName = () => isProv() ? "Инженер (демо)" : "Представитель: " + (client(ROLE.clientId)?.name || "");

// ---------- логика ----------
function syncTasks(o) {
  const y = TODAY().getFullYear(); o.tasks = o.tasks || {};
  const appl = TASKS.filter(t => t.applies(o.profile, o.systems, y)).map(t => t.code);
  for (const code of appl) {
    const t = TASKS_BY_CODE[code], per = taskPeriod(t, o.profile, o.systems), ex = o.tasks[code];
    if (ex) { ex.active = true; if (!ex.custom) ex.period = per; }
    else o.tasks[code] = {period: per, custom: false, side: t.side, last: null, active: true};
  }
  for (const code in o.tasks) if (!appl.includes(code)) o.tasks[code].active = false;
}
function taskRows(o) {
  const today = TODAY(), rows = [];
  for (const [code, r] of Object.entries(o.tasks || {})) {
    const t = TASKS_BY_CODE[code]; if (!t || !r.active) continue;
    const last = parse(r.last), due = last ? addMonths(last, r.period) : null;
    let status = "nodata", dd = null;
    if (due) { dd = days(due, today); const warn = r.period <= 1 ? 7 : 30; status = dd < 0 ? "overdue" : dd <= warn ? "soon" : "ok"; }
    rows.push({code, ...t, side: r.side, period: r.period, custom: r.custom, last: r.last, due: due ? iso(due) : null, status, days: dd});
  }
  const ord = {overdue:0, nodata:1, soon:2, ok:3};
  return rows.sort((a, b) => ord[a.status] - ord[b.status] || (a.due || "").localeCompare(b.due || ""));
}
function checklistRows(o) {
  return CHECKLIST.filter(([, , , c]) => c(o.profile, o.systems)).map(([no, text, ref]) => {
    const a = (o.checklist || {})[no] || {};
    return {no, text, ref, fromFile: no <= 29, answer: a.answer || null, comment: a.comment || "", at: a.at};
  });
}
function summary(o) {
  const tasks = taskRows(o), cl = checklistRows(o).filter(c => c.answer !== "na");
  const cnt = {overdue:0, soon:0, ok:0, nodata:0}; tasks.forEach(t => cnt[t.status]++);
  const yes = cl.filter(c => c.answer === "yes").length, no = cl.filter(c => c.answer === "no").length;
  const un = cl.filter(c => !c.answer).length;
  const open = (o.issues || []).filter(i => i.status !== "resolved");
  const crit = open.filter(i => i.severity === "critical").length;
  const level = (cnt.overdue || no || crit) ? "red" : (cnt.soon || cnt.nodata || un || open.length) ? "yellow" : "green";
  const lastJ = (o.journal || []).map(j => j.date).sort().pop();
  return {tasks: cnt, clTotal: cl.length, yes, no, un, pct: cl.length ? Math.round(100 * yes / cl.length) : 0,
          open: open.length, crit, req: open.filter(i => i.kind === "request").length, level, lastJ};
}
function addIssue(o, title, desc = "", severity = "medium", kind = "remark", due = null, clNo = null) {
  o.issues = o.issues || [];
  o.issues.push({id: nid(), title: title.slice(0, 300), desc, severity, status: "open", kind, due, clNo,
                 created: iso(TODAY()), by: userName()});
}
function markDone(o, code, date) { const t = o.tasks[code]; if (t && (!t.last || t.last < date)) t.last = date; }

// ---------- общие куски разметки ----------
function levelPill(l) { return pill(l, LEVELS[l]); }
function tPill(s) { return pill(TSTATUS[s][1], TSTATUS[s][0]); }
function sevPill(s) { return pill({critical:"red", medium:"yellow", low:"gray"}[s], SEV[s]); }
function iPill(s) { return pill({open:"red", in_progress:"yellow", resolved:"green"}[s], ISTATUS[s]); }
const opts = (list, sel) => list.map(v => `<option ${v === sel ? "selected" : ""}>${h(v)}</option>`).join("");
const optsKV = (obj, sel) => Object.entries(obj).map(([k, v]) => `<option value="${h(k)}" ${k === sel ? "selected" : ""}>${h(v)}</option>`).join("");
function sysParams(code, prm) {
  return SYSTEMS[code].fields.filter(f => prm[f.key]).map(f => `${f.label}: ${prm[f.key] === true ? "да" : h(prm[f.key])}`).join("; ");
}

      <div class="kpi"><div class="v">${sum(s => s.open)}</div><div class="l">открытых замечаний${sum(s => s.req) ? `, из них заявок: ${sum(s => s.req)}` : ""}</div></div>
    </div>

    <div class="tablewrap"><table class="tbl"><thead><tr><th>Объект</th><th>Состояние</th><th>Чек-лист</th><th>Работы</th><th>Замечания</th><th>Последняя запись</th></tr></thead><tbody>
    ${rows.map(([o, s]) => `<tr class="row-${s.level}">
      <td><a href="#/o/${o.id}"><b>${h(o.name)}</b></a><div class="small muted">${h(o.address)}${isProv() && client(o.clientId) ? " · " + h(client(o.clientId).name) : ""}</div></td>

      <td class="small">${s.tasks.overdue ? pill("red", "просрочено " + s.tasks.overdue) + " " : ""}${s.tasks.soon ? pill("yellow", "скоро " + s.tasks.soon) + " " : ""}${s.tasks.nodata ? pill("gray", "нет данных " + s.tasks.nodata) : ""}${!(s.tasks.overdue || s.tasks.soon || s.tasks.nodata) ? pill("green", "все в срок") : ""}</td>
      <td class="small">${s.open ? s.open + (s.crit ? ` · <span style="color:var(--red)">крит.: ${s.crit}</span>` : "") : '<span class="muted">—</span>'}</td>

function pageForm(o) {

    if (f.type === "bool") return `<label class="check"><input type="checkbox" name="${name}" ${val ? "checked" : ""}> ${h(f.label)}</label>`;
    let inp;
    if (f.type === "select") inp = `<select name="${name}"><option value="">—</option>${opts(f.options, val)}</select>`;
    else if (f.type === "textarea") inp = `<textarea name="${name}">${h(val)}</textarea>`;
    else inp = `<input type="${f.type === "number" ? "number" : "text"}" step="any" name="${name}" value="${h(val)}">`;
    return `<div class="field" ${f.type === "textarea" ? 'style="grid-column:1/-1"' : ""}><label>${h(f.label)}</label>${inp}${f.hint ? `<div class="hint">${h(f.hint)}</div>` : ""}</div>`;

    <td class="small">${SIDE[t.side]}</td>
    <td class="small">${periodLabel(t.period)}${t.custom ? ' <span class="tag">изменено</span>' : ""}
      ${isProv() ? `<details><summary>изменить</summary><form data-form="taskedit" data-id="${o.id}" data-code="${t.code}" style="margin-top:.4rem">
        <div class="field"><label>Месяцев</label><input type="number" name="period" min="1" max="120" value="${t.period}"></div>
        <div class="field"><label>Кто выполняет</label><select name="side">${optsKV(SIDE, t.side)}</select></div>
        <label class="check"><input type="checkbox" name="reset"> вернуть норматив</label><button class="btn sm">Сохранить</button></form></details>` : ""}</td>
    <td class="small">${ruDate(t.last)}</td>
    <td style="white-space:nowrap">${tPill(t.status)}<div class="small muted">${t.due ? ruDate(t.due) : ""} ${t.days === null ? "" : t.days < 0 ? `(${-t.days} дн. назад)` : `(через ${t.days} дн.)`}</div></td>
    <td><form data-form="taskdone" data-id="${o.id}" data-code="${t.code}">

      <details><summary>результат, примечание</summary><select name="result" style="margin-top:.4rem">${opts(RESULTS)}</select>

  </tr>`).join("") || `<tr><td colspan="6" class="empty">Работ нет — заполните системы в анкете.</td></tr>`}

}

function pagePlan() {
  const horizon = +(sessionStorage.getItem("horizon") || 60), side = sessionStorage.getItem("side") || "";
  const items = [];
  visible().forEach(o => taskRows(o).forEach(t => {
    if (side && t.side !== side) return;
    if (["overdue", "nodata"].includes(t.status) || (t.days !== null && t.days <= horizon)) items.push([o, t]);
  }));
  const ord = {overdue:0, soon:1, ok:2, nodata:3};
  items.sort((a, b) => ord[a[1].status] - ord[b[1].status] || (a[1].due || "9999").localeCompare(b[1].due || "9999"));
  return `<div class="head"><div><h1>План-график работ</h1><div class="muted">Просроченные, без данных и со сроком в ближайшие ${horizon} дней — по всем объектам</div></div>
    <form class="rowform" data-form="plan"><select name="days">${[14, 30, 60, 90, 180, 365].map(d => `<option value="${d}" ${horizon === d ? "selected" : ""}>${d} дней</option>`).join("")}</select>
    <select name="side"><option value="">Все исполнители</option>${optsKV(SIDE, side)}</select><button class="btn ghost sm">Показать</button></form></div>
  <div class="tablewrap"><table class="tbl"><thead><tr><th>Срок</th><th>Статус</th><th>Работа</th><th>Объект</th><th>Кто</th></tr></thead><tbody>

  <h2>5. Открытые замечания</h2><table class="tbl"><tr><th>Замечание</th><th>Важность</th><th>Срок</th></tr>

// ---------- роутер ----------
function route() {
  const parts = (location.hash || "#/").slice(2).split("/").filter(Boolean);
  let html;
  if (!parts.length) html = pageDashboard();
  else if (parts[0] === "plan") html = pagePlan();
  else if (parts[0] === "issues") html = pageAllIssues();
  else if (parts[0] === "clients") html = pageClients();
  else if (parts[0] === "data") html = pageData();
  else if (parts[0] === "new") html = isProv() ? pageForm(null) : `<div class="panel">Новые объекты заводит обслуживающая организация.</div>`;
  else if (parts[0] === "o") {
    const o = obj(+parts[1]);
    if (!o || (!isProv() && o.clientId !== ROLE.clientId)) html = `<div class="panel">Объект не найден или нет доступа. <a href="#/">К списку</a></div>`;
    else html = ({"": pageObject, checklist: pageChecklist, schedule: pageSchedule, journal: pageJournal, issues: pageIssues,
                  edit: pageForm, report: pageReport}[parts[2] || ""] || pageObject)(o);
  } else html = pageDashboard();
  const isReport = parts[2] === "report";
  document.getElementById("app").innerHTML = (isReport ? "" : header()) +
    `<main class="wrap">${flashHtml()}${html}</main>`;
  document.querySelectorAll(".sys input[data-sys]").forEach(cb => cb.addEventListener("change", () => cb.closest(".sys").classList.toggle("on", cb.checked)));
}
let FLASH = null;
const flash = (msg, cls = "ok") => { FLASH = [msg, cls]; };
function flashHtml() { if (!FLASH) return ""; const [m, c] = FLASH; FLASH = null; return `<div class="flash ${c}">${h(m)}</div>`; }
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; window.scrollTo(0, 0); }

// ---------- обработчики форм ----------
const FORMS = {
  search(f, d) { sessionStorage.setItem("q", d.get("q") || ""); route(); },
  ifilter(f, d) { sessionStorage.setItem("ifilter", d.get("f")); route(); },
  plan(f, d) { sessionStorage.setItem("horizon", d.get("days")); sessionStorage.setItem("side", d.get("side")); route(); },
  object(f, d) {
    const profile = {}, systems = {};
    QUESTIONNAIRE.forEach(sec => sec.fields.forEach(fl => { profile[fl.key] = fl.type === "bool" ? d.has("p_" + fl.key) : (d.get("p_" + fl.key) || "").trim(); }));
    for (const [code, sd] of Object.entries(SYSTEMS)) if (d.has("sys_" + code)) {
      systems[code] = {}; sd.fields.forEach(fl => { const n = `s_${code}_${fl.key}`; systems[code][fl.key] = fl.type === "bool" ? d.has(n) : (d.get(n) || "").trim(); });
    }
    let clientId = null;
    if (isProv()) {
      const nc = (d.get("newClient") || "").trim();
      if (nc) { clientId = nid(); DB.clients.push({id: clientId, name: nc}); } else clientId = d.get("clientId") ? +d.get("clientId") : null;
    }
    let o = f.dataset.id ? obj(+f.dataset.id) : null;
    if (o) { Object.assign(o, {name: d.get("name").trim() || o.name, address: (d.get("address") || "").trim(), profile, systems}); if (isProv()) o.clientId = clientId; }
    else { o = {id: nid(), clientId, name: d.get("name").trim(), address: (d.get("address") || "").trim(), profile, systems, tasks: {}, checklist: {}, journal: [], issues: []}; DB.objects.push(o); }
    syncTasks(o); save();
    flash(f.dataset.id ? "Анкета сохранена, график работ и чек-лист пересчитаны" : "Объект создан. Сформированы чек-лист и график регламентных работ.");
    go(`#/o/${o.id}`);
  },
  checklist(f, d) {
    const o = obj(+f.dataset.id); o.checklist = o.checklist || {};
    for (const r of checklistRows(o)) {
      const ans = d.get("a_" + r.no) || null, com = (d.get("c_" + r.no) || "").trim();
      if (ans !== r.answer || com !== r.comment) o.checklist[r.no] = {answer: ans, comment: com, at: iso(TODAY())};
      const open = (o.issues || []).find(i => i.clNo === r.no && i.status !== "resolved");
      if (ans === "no" && !open) addIssue(o, `Чек-лист п. ${r.no}: ${r.text.slice(0, 150)}`, com, "medium", "remark", null, r.no);
      else if ((ans === "yes" || ans === "na") && open) Object.assign(open, {status: "resolved", resolved: iso(TODAY()), resolution: "Отмечено выполненным в чек-листе"});
    }
    save(); flash("Чек-лист сохранён"); route(); window.scrollTo(0, 0);
  },
  taskdone(f, d) {
    const o = obj(+f.dataset.id), code = f.dataset.code, t = TASKS_BY_CODE[code], date = d.get("date");
    if (!date || date > iso(TODAY())) { flash("Дата не может быть в будущем", "error"); return route(); }
    const result = d.get("result") || RESULTS[0], note = (d.get("note") || "").trim();
    o.journal.push({id: nid(), date, task: code, system: t.system || "", type: "Плановая работа", desc: t.title + (note ? ". " + note : ""),
                    result, performer: (d.get("performer") || "").trim() || userName(), by: userName()});
    markDone(o, code, date);
    if (result === "Неисправно") addIssue(o, "Неисправность: " + t.title, note, "critical");
    save(); flash(`Отмечено: ${t.title} — ${ruDate(date)}`); route();
  },
  taskedit(f, d) {
    const o = obj(+f.dataset.id), tk = o.tasks[f.dataset.code], per = +d.get("period");
    tk.side = d.get("side");
    if (d.has("reset")) tk.custom = false; else if (per >= 1 && per <= 120) { tk.period = per; tk.custom = true; }
    syncTasks(o); save(); flash("Параметры работы обновлены"); route();
  },
  journal(f, d) {
    const o = obj(+f.dataset.id), date = d.get("date");
    if (!date || date > iso(TODAY())) { flash("Дата не может быть в будущем", "error"); return route(); }
    const task = d.get("task") || "", system = d.get("system") || (task ? TASKS_BY_CODE[task].system || "" : ""), result = d.get("result");
    o.journal.push({id: nid(), date, task, system, type: d.get("type"), desc: (d.get("desc") || "").trim(), result,
                    performer: (d.get("performer") || "").trim() || userName(), by: userName()});
    if (task) markDone(o, task, date);
    if (result === "Неисправно") addIssue(o, "Неисправность: " + (SYSTEMS[system]?.name || d.get("type")), d.get("desc") || "", "critical");
    save(); flash("Запись добавлена в журнал"); route();
  },
  issue(f, d) {
    const o = obj(+f.dataset.id);
    addIssue(o, d.get("title").trim(), (d.get("desc") || "").trim(), d.get("severity"), isProv() ? "remark" : "request", d.get("due") || null);
    save(); flash(isProv() ? "Замечание добавлено" : "Заявка отправлена обслуживающей организации"); route();
  },
  issueupd(f, d) {
    const o = obj(+f.dataset.id), i = o.issues.find(x => x.id === +f.dataset.iid);
    i.status = d.get("status"); const r = (d.get("resolution") || "").trim(); if (r) i.resolution = r;
    i.resolved = i.status === "resolved" ? iso(TODAY()) : null;
    save(); flash("Статус обновлён"); route();
  },
  client(f, d) {
    DB.clients.push({id: nid(), name: d.get("name").trim(), inn: d.get("inn"), contact: d.get("contact"), phone: d.get("phone")});
    save(); flash("Организация добавлена"); route();
  },
};
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault(); FORMS[f.dataset.form](f, new FormData(f));
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "role") {
    ROLE = el.value === "p" ? {mode: "provider"} : {mode: "client", clientId: +el.value};
    localStorage.setItem(ROLE_KEY, JSON.stringify(ROLE));
    flash(isProv() ? "Вы вошли как обслуживающая организация" : "Вы вошли как эксплуатант: " + client(ROLE.clientId).name);
    go("#/");
  }
  if (el.dataset.act === "import" && el.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { try { const x = JSON.parse(rd.result); if (!x.objects) throw 0; DB = x; save(); flash("Данные загружены"); go("#/"); }
                        catch (err) { flash("Это не файл данных «Мониторинга»", "error"); route(); } };
    rd.readAsText(el.files[0]);
  }
});
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const act = el.dataset.act;
  if (act === "export") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 1)], {type: "application/json"}));
    a.download = `monitoring-demo-${iso(TODAY())}.json`; a.click();
  }
  if (act === "reset" && confirm("Удалить все внесённые данные и вернуть демо-объекты?")) { DB = seed(); save(); flash("Демо-данные восстановлены"); go("#/"); }
  if (act === "archive" && confirm("Перенести объект в архив?")) { obj(+el.dataset.id).archived = true; save(); flash("Объект в архиве"); go("#/"); }
});
window.addEventListener("hashchange", route);
load(); route();

</script></body></html>
